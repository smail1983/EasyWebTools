<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Image Resizer Online — Free | EasyWebTools</title><meta name="description" content="Resize images online to custom width and height for free."><link rel="stylesheet" href="assets/style.css"></head><body>
<header class="site-header"><div class="container nav"><a class="brand" href="index.html"><span class="brand-mark">✦</span> EasyWebTools</a><nav><a href="index.html">Home</a><a href="tools.html">All Tools</a><a href="about.html">About</a><a href="contact.html">Contact</a></nav></div></header><main class="tool-page"><div class="container"><div class="prose"><span class="eyebrow">IMAGE TOOL</span><h1>Image Resizer</h1><p>Resize an image to custom dimensions directly in your browser.</p></div><div class="tool-box"><div class="field"><label>Select image</label><input id="file" type="file" accept="image/*"></div><div id="controls" style="display:none"><div class="stats"><div class="stat"><span>Original width</span><b id="ow">—</b></div><div class="stat"><span>Original height</span><b id="oh">—</b></div></div><div class="field"><label>Width (px)</label><input id="w" type="number" min="1"></div><div class="field"><label>Height (px)</label><input id="h" type="number" min="1"></div><label><input id="lock" type="checkbox" checked style="width:auto"> Keep aspect ratio</label><button class="btn" id="resize">Resize & Download</button><div id="result"></div></div></div></div></main>
<script>
const f=document.getElementById('file'),c=document.getElementById('controls'),w=document.getElementById('w'),h=document.getElementById('h'),lock=document.getElementById('lock');let img=new Image();
f.onchange=()=>{const file=f.files[0];if(!file)return;img.onload=()=>{ow.textContent=img.naturalWidth;oh.textContent=img.naturalHeight;w.value=img.naturalWidth;h.value=img.naturalHeight;c.style.display='block'};img.src=URL.createObjectURL(file)};
w.oninput=()=>{if(lock.checked&&img.naturalWidth)h.value=Math.round(w.value*img.naturalHeight/img.naturalWidth)};
h.oninput=()=>{if(lock.checked&&img.naturalHeight)w.value=Math.round(h.value*img.naturalWidth/img.naturalHeight)};
document.getElementById('resize').onclick=()=>{const canvas=document.createElement('canvas');canvas.width=+w.value;canvas.height=+h.value;canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);canvas.toBlob(b=>{const u=URL.createObjectURL(b);result.innerHTML='<div class="result"><b>Ready!</b><br><a class="download" download="resized-image.jpg" href="'+u+'">Download resized image →</a></div>'},'image/jpeg',.9)};
</script>
