<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Image Resizer Online — Free | EasyWebTools</title>
<meta name="description" content="Resize images online to custom width and height for free.">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<header class="site-header"><div class="container nav"><a class="brand" href="index.html"><span class="brand-mark">✦</span> EasyWebTools</a><nav><a href="index.html">Home</a><a href="tools.html">All Tools</a><a href="about.html">About</a><a href="contact.html">Contact</a></nav></div></header>
<main class="tool-page"><div class="container"><div class="prose"><span class="eyebrow">IMAGE TOOL</span><h1>Image Resizer</h1><p>Resize an image to custom dimensions directly in your browser.</p></div>
<div class="tool-box"><div class="field"><label for="file">Select image</label><input id="file" type="file" accept="image/*"></div>
<div id="controls" style="display:none"><div class="stats"><div class="stat"><span>Original width</span><b id="ow">—</b></div><div class="stat"><span>Original height</span><b id="oh">—</b></div></div>
<div class="field"><label for="w">Width (px)</label><input id="w" type="number" min="1" step="1"></div>
<div class="field"><label for="h">Height (px)</label><input id="h" type="number" min="1" step="1"></div>
<label><input id="lock" type="checkbox" checked style="width:auto"> Keep aspect ratio</label>
<button class="btn" id="resize" type="button">Resize &amp; Download</button><div id="result"></div></div></div></div></main>
<script>
const f=document.getElementById('file'),controls=document.getElementById('controls'),w=document.getElementById('w'),h=document.getElementById('h'),lock=document.getElementById('lock'),ow=document.getElementById('ow'),oh=document.getElementById('oh'),result=document.getElementById('result');
let img=new Image(),objectUrl=null;
f.addEventListener('change',()=>{const selected=f.files[0];if(!selected)return;if(objectUrl)URL.revokeObjectURL(objectUrl);objectUrl=URL.createObjectURL(selected);img=new Image();img.onload=()=>{ow.textContent=img.naturalWidth;oh.textContent=img.naturalHeight;w.value=img.naturalWidth;h.value=img.naturalHeight;controls.style.display='block';result.innerHTML='';};img.onerror=()=>{result.innerHTML='<div class="result">Could not read this image.</div>';};img.src=objectUrl;});
w.addEventListener('input',()=>{if(lock.checked&&img.naturalWidth){const value=Number(w.value);if(value>0)h.value=Math.max(1,Math.round(value*img.naturalHeight/img.naturalWidth));}});
h.addEventListener('input',()=>{if(lock.checked&&img.naturalHeight){const value=Number(h.value);if(value>0)w.value=Math.max(1,Math.round(value*img.naturalWidth/img.naturalHeight));}});
document.getElementById('resize').addEventListener('click',()=>{
 const width=Number(w.value),height=Number(h.value);
 if(!img.naturalWidth||!img.naturalHeight||!Number.isInteger(width)||!Number.isInteger(height)||width<1||height<1){result.innerHTML='<div class="result">Please enter valid dimensions.</div>';return;}
 const canvas=document.createElement('canvas');canvas.width=width;canvas.height=height;const ctx=canvas.getContext('2d');
 if(!ctx){result.innerHTML='<div class="result">Your browser could not process this image.</div>';return;}
 ctx.imageSmoothingEnabled=true;ctx.imageSmoothingQuality='high';ctx.drawImage(img,0,0,width,height);
 canvas.toBlob(blob=>{if(!blob){result.innerHTML='<div class="result">Resize failed. Please try again.</div>';return;}const url=URL.createObjectURL(blob);result.innerHTML='<div class="result"><b>Ready!</b><br>'+width+' × '+height+' px<br><a class="download" download="resized-image.jpg" href="'+url+'">Download resized image →</a></div>';},'image/jpeg',.9);
});
</script>

</body></html>
