<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Percentage Calculator — Free | EasyWebTools</title><meta name="description" content="Free percentage calculator for finding percentages, increases, decreases and percentage differences."><link rel="stylesheet" href="assets/style.css"></head><body>
<header class="site-header"><div class="container nav"><a class="brand" href="index.html"><span class="brand-mark">✦</span> EasyWebTools</a><nav><a href="index.html">Home</a><a href="tools.html">All Tools</a><a href="about.html">About</a><a href="contact.html">Contact</a></nav></div></header><main class="tool-page"><div class="container"><div class="prose"><span class="eyebrow">CALCULATOR</span><h1>Percentage Calculator</h1><p>Calculate common percentages quickly and accurately.</p></div><div class="tool-box">
<h2>What is X% of Y?</h2><div class="field"><input id="x" type="number" placeholder="Percentage X"></div><div class="field"><input id="y" type="number" placeholder="Number Y"></div><button class="btn" onclick="calc1()">Calculate</button><div id="r1"></div>
<hr style="border:0;border-top:1px solid #e4ebe7;margin:28px 0">
<h2>Percentage change</h2><div class="field"><input id="old" type="number" placeholder="Original value"></div><div class="field"><input id="newv" type="number" placeholder="New value"></div><button class="btn" onclick="calc2()">Calculate change</button><div id="r2"></div>
</div></div></main>
<script>function calc1(){const x=+document.getElementById('x').value,y=+document.getElementById('y').value;document.getElementById('r1').innerHTML='<div class="result">'+((x/100)*y).toLocaleString()+'</div>'}function calc2(){const a=+old.value,b=+newv.value;if(a===0){r2.innerHTML='<div class="result">Original value cannot be zero.</div>';return}const p=((b-a)/a)*100;r2.innerHTML='<div class="result">'+(p>=0?'+':'')+p.toFixed(2)+'%</div>'}</script>
