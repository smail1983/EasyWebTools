<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Percentage Calculator — Free | EasyWebTools</title>
<meta name="description" content="Free percentage calculator for finding percentages, increases, decreases and percentage differences.">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<header class="site-header"><div class="container nav"><a class="brand" href="index.html"><span class="brand-mark">✦</span> EasyWebTools</a><nav><a href="index.html">Home</a><a href="tools.html">All Tools</a><a href="about.html">About</a><a href="contact.html">Contact</a></nav></div></header>
<main class="tool-page"><div class="container"><div class="prose"><span class="eyebrow">CALCULATOR</span><h1>Percentage Calculator</h1><p>Calculate common percentages quickly and accurately.</p></div>
<div class="tool-box">
<h2>What is X% of Y?</h2>
<div class="field"><label for="x">Percentage</label><input id="x" type="number" inputmode="decimal" placeholder="e.g. 15"></div>
<div class="field"><label for="y">Number</label><input id="y" type="number" inputmode="decimal" placeholder="e.g. 200"></div>
<button class="btn" id="calc1" type="button">Calculate</button><div id="r1"></div>
<hr style="border:0;border-top:1px solid #e4ebe7;margin:28px 0">
<h2>Percentage change</h2>
<div class="field"><label for="oldValue">Original value</label><input id="oldValue" type="number" inputmode="decimal" placeholder="e.g. 100"></div>
<div class="field"><label for="newValue">New value</label><input id="newValue" type="number" inputmode="decimal" placeholder="e.g. 125"></div>
<button class="btn" id="calc2" type="button">Calculate change</button><div id="r2"></div>
</div></div></main>
<script>
const x=document.getElementById('x'),y=document.getElementById('y'),r1=document.getElementById('r1');
const oldValue=document.getElementById('oldValue'),newValue=document.getElementById('newValue'),r2=document.getElementById('r2');
document.getElementById('calc1').addEventListener('click',()=>{
 const a=Number(x.value),b=Number(y.value);
 if(x.value===''||y.value===''||!Number.isFinite(a)||!Number.isFinite(b)){r1.innerHTML='<div class="result">Please enter valid numbers.</div>';return;}
 r1.innerHTML='<div class="result">'+((a/100)*b).toLocaleString(undefined,{maximumFractionDigits:10})+'</div>';
});
document.getElementById('calc2').addEventListener('click',()=>{
 const a=Number(oldValue.value),b=Number(newValue.value);
 if(oldValue.value===''||newValue.value===''||!Number.isFinite(a)||!Number.isFinite(b)){r2.innerHTML='<div class="result">Please enter valid numbers.</div>';return;}
 if(a===0){r2.innerHTML='<div class="result">Original value cannot be zero.</div>';return;}
 const p=((b-a)/a)*100;
 r2.innerHTML='<div class="result">'+(p>=0?'+':'')+p.toFixed(2)+'%</div>';
});
</script>

</body></html>
