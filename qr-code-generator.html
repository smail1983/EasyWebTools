<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>QR Code Generator — Free | EasyWebTools</title><meta name="description" content="Create a QR code from text or a URL with this free online QR code generator."><link rel="stylesheet" href="assets/style.css"></head><body>
<header class="site-header"><div class="container nav"><a class="brand" href="index.html"><span class="brand-mark">✦</span> EasyWebTools</a><nav><a href="index.html">Home</a><a href="tools.html">All Tools</a><a href="about.html">About</a><a href="contact.html">Contact</a></nav></div></header><main class="tool-page"><div class="container"><div class="prose"><span class="eyebrow">UTILITY</span><h1>QR Code Generator</h1><p>Enter text or a URL to create a QR code.</p></div><div class="tool-box"><div class="field"><label>Text or URL</label><input id="data" placeholder="https://example.com"></div><button class="btn" onclick="makeQR()">Generate QR Code</button><div id="qr" class="result" style="text-align:center;min-height:80px">Your QR code will appear here.</div></div></div></main>
<script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.4/build/qrcode.min.js"></script>
<script>function makeQR(){const v=data.value.trim();if(!v){qr.textContent='Please enter text or a URL.';return}QRCode.toCanvas(v,{width:240,margin:2},(e,canvas)=>{if(e){qr.textContent='Could not generate QR code.';return}qr.innerHTML='';qr.appendChild(canvas);const a=document.createElement('a');a.className='download';a.textContent='Download QR code →';a.download='qrcode.png';a.href=canvas.toDataURL('image/png');qr.appendChild(document.createElement('br'));qr.appendChild(a)})}</script>
