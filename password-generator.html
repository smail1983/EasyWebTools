<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Strong Password Generator — Free | EasyWebTools</title><meta name="description" content="Generate strong random passwords locally in your browser. No password is sent to a server."><link rel="stylesheet" href="assets/style.css"></head><body>
<header class="site-header"><div class="container nav"><a class="brand" href="index.html"><span class="brand-mark">✦</span> EasyWebTools</a><nav><a href="index.html">Home</a><a href="tools.html">All Tools</a><a href="about.html">About</a><a href="contact.html">Contact</a></nav></div></header><main class="tool-page"><div class="container"><div class="prose"><span class="eyebrow">SECURITY TOOL</span><h1>Password Generator</h1><p>Create a strong random password locally in your browser. Nothing is uploaded.</p></div><div class="tool-box"><div class="field"><label>Password length: <span id="lv">20</span></label><input id="len" type="range" min="8" max="64" value="20"></div><label><input id="upper" type="checkbox" checked style="width:auto"> Uppercase letters</label><label><input id="lower" type="checkbox" checked style="width:auto"> Lowercase letters</label><label><input id="numbers" type="checkbox" checked style="width:auto"> Numbers</label><label><input id="symbols" type="checkbox" checked style="width:auto"> Symbols</label><button class="btn" id="generate">Generate Password</button><div class="field" style="margin-top:18px"><input id="out" readonly></div><button class="btn secondary" id="copy">Copy password</button></div></div></main>
<script>
const len=document.getElementById('len');len.oninput=()=>lv.textContent=len.value;function gen(){let chars='';if(upper.checked)chars+='ABCDEFGHIJKLMNOPQRSTUVWXYZ';if(lower.checked)chars+='abcdefghijklmnopqrstuvwxyz';if(numbers.checked)chars+='0123456789';if(symbols.checked)chars+='!@#$%^&*()-_=+[]{}';if(!chars){out.value='Select at least one character set.';return}let s='';const a=new Uint32Array(+len.value);crypto.getRandomValues(a);for(let n of a)s+=chars[n%chars.length];out.value=s}generate.onclick=gen;copy.onclick=()=>navigator.clipboard.writeText(out.value);gen();
</script>
