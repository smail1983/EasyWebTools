<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Strong Password Generator — Free | EasyWebTools</title>
<meta name="description" content="Generate strong random passwords locally in your browser. No password is sent to a server.">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<header class="site-header"><div class="container nav"><a class="brand" href="index.html"><span class="brand-mark">✦</span> EasyWebTools</a><nav><a href="index.html">Home</a><a href="tools.html">All Tools</a><a href="about.html">About</a><a href="contact.html">Contact</a></nav></div></header>
<main class="tool-page"><div class="container"><div class="prose"><span class="eyebrow">SECURITY TOOL</span><h1>Password Generator</h1><p>Create a strong random password locally in your browser. Nothing is uploaded.</p></div>
<div class="tool-box">
<div class="field"><label>Password length: <span id="lv">20</span></label><input id="len" type="range" min="8" max="64" value="20"></div>
<label><input id="upper" type="checkbox" checked style="width:auto"> Uppercase letters</label>
<label><input id="lower" type="checkbox" checked style="width:auto"> Lowercase letters</label>
<label><input id="numbers" type="checkbox" checked style="width:auto"> Numbers</label>
<label><input id="symbols" type="checkbox" checked style="width:auto"> Symbols</label>
<button class="btn" id="generate" type="button">Generate Password</button>
<div class="field" style="margin-top:18px"><input id="out" readonly></div>
<button class="btn secondary" id="copy" type="button">Copy password</button>
<div id="copyStatus" aria-live="polite" style="margin-top:10px"></div>
</div></div></main>
<script>
const len=document.getElementById('len');
const lv=document.getElementById('lv');
const upper=document.getElementById('upper');
const lower=document.getElementById('lower');
const numbers=document.getElementById('numbers');
const symbols=document.getElementById('symbols');
const generate=document.getElementById('generate');
const out=document.getElementById('out');
const copy=document.getElementById('copy');
const copyStatus=document.getElementById('copyStatus');

len.addEventListener('input',()=>{lv.textContent=len.value;});

function gen(){
 let chars='';
 if(upper.checked) chars+='ABCDEFGHIJKLMNOPQRSTUVWXYZ';
 if(lower.checked) chars+='abcdefghijklmnopqrstuvwxyz';
 if(numbers.checked) chars+='0123456789';
 if(symbols.checked) chars+='!@#$%^&*()-_=+[]{}';
 if(!chars){out.value=''; copyStatus.textContent='Select at least one character set.'; return;}
 const values=new Uint32Array(Number(len.value));
 crypto.getRandomValues(values);
 let s='';
 for(const n of values) s+=chars[n%chars.length];
 out.value=s;
 copyStatus.textContent='';
}

generate.addEventListener('click',gen);
copy.addEventListener('click',async()=>{
 if(!out.value){copyStatus.textContent='Generate a password first.';return;}
 try{
  await navigator.clipboard.writeText(out.value);
  copyStatus.textContent='Password copied!';
 }catch(e){
  out.select();
  document.execCommand('copy');
  copyStatus.textContent='Password copied!';
 }
});

gen();
</script>

</body>
</html>
