<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Age Calculator — Calculate Exact Age | EasyWebTools</title><meta name="description" content="Calculate your exact age in years, months and days with this free online age calculator."><link rel="stylesheet" href="assets/style.css"></head><body>
<header class="site-header"><div class="container nav"><a class="brand" href="index.html"><span class="brand-mark">✦</span> EasyWebTools</a><nav><a href="index.html">Home</a><a href="tools.html">All Tools</a><a href="about.html">About</a><a href="contact.html">Contact</a></nav></div></header><main class="tool-page"><div class="container"><div class="prose"><span class="eyebrow">CALCULATOR</span><h1>Age Calculator</h1><p>Enter your date of birth to calculate your current age.</p></div><div class="tool-box"><div class="field"><label>Date of birth</label><input id="dob" type="date"></div><button class="btn" onclick="calculateAge()">Calculate Age</button><div id="result"></div></div></div></main>
<script>function calculateAge(){const d=new Date(dob.value+'T00:00:00');const now=new Date();if(!dob.value||d>now){result.innerHTML='<div class="result">Please enter a valid date of birth.</div>';return}let y=now.getFullYear()-d.getFullYear(),m=now.getMonth()-d.getMonth(),day=now.getDate()-d.getDate();if(day<0){m--;day+=new Date(now.getFullYear(),now.getMonth(),0).getDate()}if(m<0){y--;m+=12}result.innerHTML='<div class="result"><b>You are '+y+' years, '+m+' months and '+day+' days old.</b></div>'}</script>
